ilter="url(#shadow)"><circle cx="545" cy="535" r="24" fill="#286c9d" stroke="#fff" stroke-width="5"/><text x="545" y="541" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#fff">5</text></g><text x="575" y="541" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750" fill="#17211d" paint-order="stroke" stroke="#fff" stroke-width="6">Piper Park</text><g filter="url(#shadow)"><circle cx="690" cy="565" r="24" fill="#286c9d" stroke="#fff" stroke-width="5"/><text x="690" y="571" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#fff">6</text></g><text x="720" y="571" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750" fill="#17211d" paint-order="stroke" stroke="#fff" stroke-width="6">Tunnel</text><g filter="url(#shadow)"><circle cx="855" cy="605" r="24" fill="#286c9d" stroke="#fff" stroke-width="5"/><text x="855" y="611" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#fff">7</text></g><text x="885" y="611" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750" fill="#17211d" paint-order="stroke" stroke="#fff" stroke-width="6">Kustaanmiekka</text><g filter="url(#shadow)"><circle cx="1045" cy="680" r="24" fill="#286c9d" stroke="#fff" stroke-width="5"/><text x="1045" y="686" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="800" fill="#fff">8</text></g><text x="1075" y="686" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" font-weight="750" fill="#17211d" paint-order="stroke" stroke="#fff" stroke-width="6">King’s Gate</text><g transform="translate(70 650)"><rect width="650" height="72" rx="25" fill="#fff" opacity=".94"/><text x="28" y="29" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#17211d">Rückweg</text><text x="28" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#68736d">King’s Gate → Vesikko → Hauptanleger oder saisonale Wasserbusverbindung prüfen.</text></g></svg>